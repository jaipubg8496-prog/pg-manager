<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PG Manager — Sign in</title>
<link rel="stylesheet" href="/static/css/style.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card panel">
    <h1>PG Manager</h1>
    <div class="subtitle">Rent tracking for your PG, without the register.</div>

    <div id="google-signin-container" style="display:none; margin-bottom: 18px;">
      <div id="google-signin-button"></div>
      <div class="auth-divider"><span>or</span></div>
    </div>

    <div class="auth-toggle">
      <button id="tab-login" class="active">Log in</button>
      <button id="tab-signup">Create account</button>
    </div>

    <!-- Login form -->
    <form id="login-form">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" required>

      <label for="login-password">Password</label>
      <input type="password" id="login-password" required>

      <button type="submit" class="primary">Log in</button>
    </form>

    <!-- Signup form -->
    <form id="signup-form" style="display:none;">
      <label for="signup-name">Your name</label>
      <input type="text" id="signup-name" required>

      <label for="signup-email">Email</label>
      <input type="email" id="signup-email" required>

      <label for="signup-phone">Phone</label>
      <input type="tel" id="signup-phone" required>

      <label for="signup-password">Password</label>
      <input type="password" id="signup-password" required minlength="6">

      <button type="submit" class="primary">Create account</button>
    </form>

    <div id="error-box" class="error-msg" style="display:none;"></div>
  </div>
</div>

<script src="/static/js/api.js"></script>
<script src="/static/js/login.js"></script>
</body>
</html>
